services:
  db:
    image: postgres:15-alpine
    container_name: wallet_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wallet_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d wallet_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallet_api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: wallet_db
      DB_SSLMODE: disable
      DB_TIMEZONE: Asia/Bangkok
      # Set to "info" to watch every SQL statement scroll by during a demo.
      DB_LOG_LEVEL: warn
      APP_PORT: "8080"
    # Readiness, not liveness: healthy only once the API can reach the database.
    # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first,
    # and Fiber listens on IPv4 only.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
